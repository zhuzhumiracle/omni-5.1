# cfg/eval_gui.yaml
hydra:
  searchpath:
    - file://../cfg

defaults:
  - task: Forest
  # 1. 借壳：去读系统里存在的 mappo 配置文件，不让 Hydra 报错
  - algo: mappo    
  - _self_

# 2. 还魂：把算法名字强行改回 ppo，让代码能加载正确的 PPO 策略网络
algo:
  name: ppo

headless: False
checkpoint_path: /home/descfly/visualandlidar/base/omni-5.1/OmniDrones/scripts/wandb/run-20260220_092443-t4xcsggf/files/checkpoint_best_return_310.36.pt

task:
  drone_model:
    name: Hummingbird
  lidar_range: 4.0
  lidar_vfov: [-10.0, 20.0]
  
env:
  num_envs: 16

sim: ${task.sim}
total_frames: -1  
seed: 0

viewer:
  resolution: [960, 720]
  eye: [8, 0., 6.]
  lookat: [0., 0., 1.]