name: forest_singal


defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /base/env_base@_here_
  - /base/sim_base@_here_

env:
  num_envs: 150
  max_episode_length: 1500

# ../viewer:
#   eye: [0., 8., 6.]

drone_model:
  name: Hummingbird
  controller: LeePositionController

time_encoding: true

lidar_range: 10.
lidar_vfov: [-10., 20.]
num_lidar_points: 20000

action_transform: null

# 固定俯视相机参数（仅影响可视化）
# 棋盘中心（世界坐标）
topdown_center_xyz: [0.0, 0.0, 0.0]
# 相机绝对高度（世界坐标 z）
topdown_camera_z: 70.0
# 兼容旧参数（当 topdown_camera_z 缺失时生效）
topdown_view_height: 70.0
topdown_lookat_z: 0.0

reward_effort_weight: 0.1

# ===== curriculum stage-1 (easy) =====
goal_radius: 7 #7.0 4
goal_bonus: 2000 #2000
collision_dist: 0.1
collision_penalty: -5.0 #-30

# 分段里程碑奖励：按路程比例触发一次性奖励。
# 当 milestone_segments=3 且 milestone_include_goal_segment=false 时，阈值为 1/3、2/3。
milestone_segments: 10 #5
milestone_include_goal_segment: false
milestone_mid_reward: 1000 #1000
# 每段奖励 = milestone_mid_reward * 对应百分比 / 100
# 下面示例表示：第1段 100%，第2段 160%
milestone_reward_percents: [50, 40, 30, 30, 20, 20, 20, 20, 20]                         #[20, 20, 20, 20, 20]

v_max: 8 #最新的报告好像显示最快的是8m/s，说是这个无人机的最高速度是15m/s，暂时设置成15，后续可以调整
z_min: 0.4
z_max: 3.8
lambda_esdf: 0.5 
k_esdf: 1.6 #1.6

w_forward: 3 #30
w_smooth: -0.3 #-0.5
w_max_speed: -0.5  #-0.1
w_z: -2 #-2
w_esdf: 2 # 2
w_yaw: 0.3 #0.3
w_thrust: -0.1

terminate_z_min: 0.4
terminate_z_max: 10
terminate_v_norm: 15 #8

sim:
  enable_replicator: true